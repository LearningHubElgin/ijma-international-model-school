  <g fill="#ffffff" text-anchor="middle" font-family="'Nunito', sans-serif">
    <circle cx="200" cy="125" r="32" fill="#ffffff" fill-opacity="0.2" />
    <text x="200" y="132" font-size="28" font-weight="700">★</text>
    <text x="200" y="175" font-size="24" font-weight="700">Practical Life Lab</text>
